# API key của provider đặt trong file .env với biến tương ứng.
# Biến môi trường có cùng tên sẽ được ưu tiên hơn các giá trị ở đây.

app:
  name: AI Data Profiling Agent
  env: development
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  data_dir: ./data

cors:
  origins: http://localhost:3000,http://127.0.0.1:3000

llm:
  provider: gemini
  model: gemini-3.6-flash
  temperature: 0.2
  max_tool_rounds: 6

profiling:
  default_scan_mode: sample
  sample_size: 10000
  sample_strategy: reservoir
  random_seed: 42
  top_k_values: 10
  outlier_method: iqr
  max_columns: 200
  worker_concurrency: 1
  worker_poll_seconds: 1.0
  worker_lease_seconds: 300
  worker_max_attempts: 3
  worker_shutdown_grace_seconds: 30

hitl:
  auto_confirm: true
  confidence_threshold: 0.95
  low_risk_types:
    - semantic_type
  max_deep_analysis: 5

stats:
  alpha: 0.05
  fdr_method: benjamini_hochberg
  max_tests_per_request: 20

retrieval:
  index_dir: ./data/index
  index_refresh_seconds: 5
  top_k: 5
  candidate_k: 20
  embedding_provider: voyage
  # Voyage uses document/query embeddings separately for retrieval.
  embedding_model: voyage-3.5
  # Used automatically when Voyage is unavailable or rate-limited.
  local_fallback_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  enable_rerank: false
  # Enable after validating and importing data/knowledge_base in staging.
  external_knowledge_enabled: true
  profile_top_k: 1
  knowledge_top_k: 4
  max_chunks_per_source: 2
  profile_context_chars: 12000
  knowledge_context_chars: 12000

security:
  require_api_token: false
  # Frontend polling can reach roughly 200 calls/minute while a profile is
  # running. Keep a bounded per-user ceiling with room for concurrent views.
  user_rate_per_minute: 600
  max_upload_mb: 500
  allow_raw_export: false
  mask_pii_in_answers: true
  # Empty -> append-only audit_events table in Supabase PostgreSQL.
  audit_log: ""

auth:
  # dual is a short rollout bridge; production must set supabase.
  mode: dual
  allow_signup: false
  require_email_confirmed: true
  audience: authenticated
  jwks_cache_ttl_seconds: 300

guardrails:
  # Trần cứng mỗi request, độc lập với số vòng hội thoại tool của LLM.
  max_tool_calls_per_request: 10
  # Giới hạn dữ liệu untrusted đưa vào model và kích thước output trả về.
  max_context_chars: 24000
  max_output_chars: 12000
  # Mặc định audit chỉ lưu hash + độ dài câu hỏi, không lưu nội dung người dùng.
  audit_question_content: false

# Agent runtime v2 is additive. Keep every enforcement feature off until the
# corresponding migration and deterministic eval gates have passed.
agent:
  trace_mode: "shadow"
  verifier_mode: "off"
  planner_enabled: false
  jobs_enabled: false
  workspace_memory_enabled: false
  personal_memory_enabled: false
  runtime_version: 2.0.0
  trace_event_limit: 500


# Optional, fail-open observability projection. The adapter itself uses only
# an allow-list of metadata; prompts, messages, rows, paths and PII stay local.
langsmith:
  tracing: false
  endpoint: https://api.smith.langchain.com
  project: ""
  data_mode: metadata_only
  sampling_rate: 1.0
  flush_timeout_seconds: 2.0
# Command Center production core đã qua bounded-engine, cross-workspace và E2E
# smoke test. Có thể override bằng UX_COMMAND_CENTER_ENABLED khi cần rollback.
ux:
  command_center_enabled: true
  preview_timeout_seconds: 60
  preview_row_budget: 50000
  preview_result_limit: 50
  official_result_limit: 500

database:
  # Set DATABASE_URL in .env. PostgreSQL is required in every environment.
  url: ""
  checkpointer_url: ""

storage_provider: supabase
guest_storage_provider: supabase
guest_max_upload_mb: 25
guest_retention_hours: 24

supabase:
  url: ""
  publishable_key: ""
  secret_key: ""
  # Temporary compatibility only. Prefer secret_key.
  service_role_key: ""
  storage_bucket: p170-dataset
  storage_prefix: datasets
  storage_timeout_seconds: 300
  storage_resumable_threshold_mb: 6
  storage_chunk_mb: 6
  google_drive_chunk_mb: 8
  google_drive_oauth_state_ttl_seconds: 600
