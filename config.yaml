# =============================================================================
# P-170 — AI Data Profiling Agent
# Cấu hình KHÔNG chứa secret. File này public trong repo.
# Mọi API key / mật khẩu đặt trong .env (xem .env.example).
#
# Thứ tự ưu tiên: biến môi trường (.env)  >  config.yaml  >  default trong code
# Tên field tương ứng: <section>_<key>  (vd: llm.model -> LLM_MODEL)
# =============================================================================

app:
  name: "AI Data Profiling Agent"
  env: development            # development | production | test
  host: "0.0.0.0"
  port: 8000
  log_level: INFO             # DEBUG | INFO | WARNING | ERROR
  data_dir: "./data"

cors:
  origins: "http://localhost:3000,http://localhost:5173"

# --- LLM -------------------------------------------------------------------
# Provider quyết định base_url + tên biến môi trường chứa API key.
# openai | openrouter | gemini | groq | together | ollama | custom
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.2            # thấp — agent diễn giải số liệu, không sáng tác
  max_tool_rounds: 6          # chặn vòng lặp tool-calling vô hạn
  reasoning_effort: ""        # để trống nếu model không hỗ trợ (o-series/gpt-5 mới dùng)
  base_url: ""               # chỉ điền khi provider = custom

# --- Profiling -------------------------------------------------------------
profiling:
  default_scan_mode: sample   # full | sample
  sample_size: 10000
  sample_strategy: reservoir  # reservoir | tablesample
  random_seed: 42             # reproducibility — Known Limitation L5
  top_k_values: 10
  outlier_method: iqr         # iqr | zscore | both
  max_columns: 200            # chặn bảng quá rộng làm nổ cost LLM

# --- HITL (ADR-004: tiered review) -----------------------------------------
hitl:
  auto_confirm: true
  confidence_threshold: 0.95  # >= ngưỡng này + low-risk -> auto-confirm + audit log
  low_risk_types: ["semantic_type"]   # candidate_key & pii luôn cần Analyst confirm
  max_deep_analysis: 5        # Known Limitation L3 — chặn loop deep_analysis <-> HITL

# --- Kiểm định thống kê ----------------------------------------------------
stats:
  alpha: 0.05
  fdr_method: benjamini_hochberg   # Known Limitation L1 — hiệu chỉnh multiple testing
  max_tests_per_request: 20

# --- Retrieval (ADR-007: FAISS dense + BM25 keyword + rerank) --------------
retrieval:
  index_dir: "./data/index"
  top_k: 5
  candidate_k: 20
  embedding_provider: local   # local | openai | none
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  enable_rerank: false        # bật khi đã cài extras [rerank]

# --- Bảo mật / governance --------------------------------------------------
security:
  require_api_token: false    # bật ở production; token đặt ở API_TOKEN trong .env
  user_rate_per_minute: 30
  max_upload_mb: 50
  allow_raw_export: false     # fail-closed: không xuất raw data (eval case C-02)
  mask_pii_in_answers: true   # fail-closed: không trả giá trị cột PII (eval case C-01)
  audit_log: "./data/audit.jsonl"

# --- Database --------------------------------------------------------------
# Dev: SQLite zero-config. Prod: PostgreSQL (ADR-009) — đặt DATABASE_URL trong .env.
database:
  url: "sqlite:///./data/app.db"
  checkpointer_url: ""        # để trống -> dùng SQLite checkpointer cạnh app.db (L2)
