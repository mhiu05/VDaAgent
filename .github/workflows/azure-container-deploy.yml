name: Deploy Azure Containers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_quality:
        description: "Deploy without waiting for the quality gates"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request checks may be cancelled; a production release never is.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RESOURCE_GROUP: rg-p170-linh-260829
  ACR_NAME: p170linh260829acr
  ACR_LOGIN_SERVER: p170linh260829acr.azurecr.io
  BACKEND_APP: vdaagent-api
  WORKER_APP: ${{ vars.AZURE_PROFILING_WORKER_APP }}
  WORKER_APP_SERVICE_PLAN: asp-vdaagent-worker
  FRONTEND_APP: vdaagent
  BACKEND_URL: https://vdaagent-api.azurewebsites.net
  FRONTEND_URL: https://vdaagent.azurewebsites.net
  AZURE_CLI_IMAGE: mcr.microsoft.com/azure-cli:2.75.0

jobs:
  changes:
    name: Detect deploy-relevant changes
    runs-on: self-hosted
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          if printf '%s\n' "$changed" | grep -Eq '^(backend/|frontend/|Dockerfile\.|requirements\.azure\.txt|alembic/|\.github/workflows/azure-container-deploy\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  backend-quality:
    name: Backend quality
    # Pushes deploy directly; pull requests and manual runs keep the quality gate.
    if: ${{ github.event_name != 'push' && !inputs.skip_quality }}
    runs-on: self-hosted
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: p170_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p170_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          for attempt in 1 2 3; do
            if python -m pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              --retries 10 \
              --timeout 120 \
              -r requirements.txt; then
              exit 0
            fi
            echo "Backend dependency installation failed on attempt ${attempt}/3; retrying..."
            sleep 5
          done
          exit 1

      - name: Lint backend
        run: ruff check backend/src tests

      - name: Test backend
        env:
          P170_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/p170_test
        run: python -m pytest -q

      - name: Validate offline AI evaluation contracts
        run: |
          python tests/evaluations/run_evaluation.py --dry-run
          python tests/evaluations/run_evaluation.py --offline

  frontend-quality:
    name: Frontend quality
    if: ${{ github.event_name != 'push' && !inputs.skip_quality }}
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_UX_COMMAND_CENTER_ENABLED: "true"
        run: pnpm build

      - name: Test frontend workflows
        working-directory: frontend
        env:
          NEXT_PUBLIC_UX_COMMAND_CENTER_ENABLED: "true"
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-and-deploy:
    name: Build and deploy Azure containers
    needs:
      - changes
      - backend-quality
      - frontend-quality
    # !cancelled() lets a skipped gate through; a failed one still stops the release.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: self-hosted
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          WORKER_APP: ${{ vars.AZURE_PROFILING_WORKER_APP }}
          ACR_PULL_USERNAME: ${{ secrets.ACR_PULL_USERNAME }}
          ACR_PULL_PASSWORD: ${{ secrets.ACR_PULL_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATASOURCE_ENCRYPTION_KEY: ${{ secrets.DATASOURCE_ENCRYPTION_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'google_drive' }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            WORKER_APP \
            ACR_PULL_USERNAME ACR_PULL_PASSWORD \
            DATABASE_URL SUPABASE_SECRET_KEY DATASOURCE_ENCRYPTION_KEY \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            test -n "${!name}" || missing+=("$name")
          done
          if [ "$STORAGE_PROVIDER" = "google_drive" ]; then
            for name in \
              GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET \
              GOOGLE_DRIVE_FOLDER_ID GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY; do
              test -n "${!name}" || missing+=("$name")
            done
          fi
          # Report every gap at once so a release is not retried one secret at a time.
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing production configuration: ${missing[*]}"
            echo "WORKER_APP comes from the AZURE_PROFILING_WORKER_APP repository variable; the rest are repository secrets."
            echo "docs/azure-deploy-cicd.md explains how each value is provisioned."
            exit 1
          fi

      - name: Azure login with OIDC
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token_response="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
          federated_token="$(printf '%s' "$token_response" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
          if [ -z "$federated_token" ]; then
            echo "Could not extract GitHub OIDC token response."
            exit 1
          fi
          azure_config_dir="$RUNNER_TEMP/azure"
          mkdir -p "$azure_config_dir"
          docker pull "$AZURE_CLI_IMAGE"
          az() {
            docker run --rm -v "$azure_config_dir:/root/.azure" "$AZURE_CLI_IMAGE" az "$@"
          }
          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$federated_token" \
            --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "AZURE_CONFIG_DIR_HOST=$azure_config_dir" >> "$GITHUB_ENV"

      - name: Ensure profiling worker uses dedicated plan
        shell: bash
        run: |
          set -euo pipefail
          az() {
            docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" az "$@"
          }
          worker_plan_id="$(az appservice plan show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WORKER_APP_SERVICE_PLAN" \
            --query id -o tsv)"
          worker_app_id="$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WORKER_APP" \
            --query id -o tsv)"
          az resource update \
            --ids "$worker_app_id" \
            --set "properties.serverFarmId=$worker_plan_id" \
            --output none

      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          az() {
            docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" az "$@"
          }
          acr_token="$(az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv)"
          printf '%s' "$acr_token" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail
          backend_image="$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}"
          docker buildx build \
            --push \
            -f Dockerfile.backend.azure \
            -t "$backend_image" \
            -t "$ACR_LOGIN_SERVER/backend:latest" \
            .
          # The remote BuildKit exporter does not populate the host daemon.
          # Pull the immutable release image back for the migration container.
          docker pull "$backend_image"

      - name: Build and push frontend image
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_AUTH_ALLOW_GUEST: ${{ vars.NEXT_PUBLIC_AUTH_ALLOW_GUEST || 'false' }}
          NEXT_PUBLIC_AUTH_ALLOW_SIGNUP: ${{ vars.NEXT_PUBLIC_AUTH_ALLOW_SIGNUP || 'false' }}
        run: |
          set -euo pipefail
          docker buildx build \
            --push \
            -f Dockerfile.frontend.azure \
            --build-arg NEXT_PUBLIC_API_URL="$BACKEND_URL/api/v1" \
            --build-arg NEXT_PUBLIC_SITE_URL="$FRONTEND_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_AUTH_ALLOW_GUEST="$NEXT_PUBLIC_AUTH_ALLOW_GUEST" \
            --build-arg NEXT_PUBLIC_AUTH_ALLOW_SIGNUP="$NEXT_PUBLIC_AUTH_ALLOW_SIGNUP" \
            --build-arg NEXT_PUBLIC_UX_COMMAND_CENTER_ENABLED=true \
            -t "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/frontend:latest" \
            frontend

      - name: Run Alembic migrations
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${DATABASE_MIGRATION_URL:-}" ]; then
            echo "Skipping migrations because DATABASE_URL and DATABASE_MIGRATION_URL are not configured."
            exit 0
          fi
          docker run --rm \
            -e DATABASE_URL \
            -e DATABASE_MIGRATION_URL \
            "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
            alembic -c alembic.ini upgrade head

      - name: Deploy backend container
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CHECKPOINTER_URL: ${{ secrets.DATABASE_CHECKPOINTER_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DATASOURCE_ENCRYPTION_KEY: ${{ secrets.DATASOURCE_ENCRYPTION_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
          AUTH_ALLOW_GUEST: ${{ vars.NEXT_PUBLIC_AUTH_ALLOW_GUEST || 'false' }}
          AUTH_ALLOW_SIGNUP: ${{ vars.NEXT_PUBLIC_AUTH_ALLOW_SIGNUP || 'false' }}
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'google_drive' }}
          GUEST_STORAGE_PROVIDER: ${{ vars.GUEST_STORAGE_PROVIDER || 'supabase' }}
          # The provider pair may sit in either store, so a secret is honoured when no variable is set.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER || 'openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL || 'gpt-4o-mini' }}
          PROFILING_WORKER_CONCURRENCY: ${{ vars.PROFILING_WORKER_CONCURRENCY || '1' }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REDIRECT_URI: ${{ vars.GOOGLE_DRIVE_REDIRECT_URI }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          GOOGLE_DRIVE_FRONTEND_URL: ${{ vars.GOOGLE_DRIVE_FRONTEND_URL }}
          ACR_PULL_USERNAME: ${{ secrets.ACR_PULL_USERNAME }}
          ACR_PULL_PASSWORD: ${{ secrets.ACR_PULL_PASSWORD }}
        run: |
          set -euo pipefail
          az() {
            docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" az "$@"
          }

          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --container-image-name "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --container-registry-user "$ACR_PULL_USERNAME" \
            --container-registry-password "$ACR_PULL_PASSWORD" \
            --enable-app-service-storage false

          settings=(
            APP_ENV=production
            APP_LOG_LEVEL=INFO
            APP_HOST=0.0.0.0
            APP_PORT=8000
            WEBSITES_PORT=8000
            WEBSITES_CONTAINER_START_TIME_LIMIT=1800
            CORS_ORIGINS="$FRONTEND_URL"
            AUTH_MODE=supabase
            AUTH_ALLOW_GUEST="$AUTH_ALLOW_GUEST"
            AUTH_ALLOW_SIGNUP="$AUTH_ALLOW_SIGNUP"
            AUTH_REQUIRE_EMAIL_CONFIRMED=true
            SUPABASE_AUTH_ISSUER="${SUPABASE_URL%/}/auth/v1"
            SUPABASE_AUTH_AUDIENCE=authenticated
            SUPABASE_URL="$SUPABASE_URL"
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
            STORAGE_PROVIDER="$STORAGE_PROVIDER"
            GUEST_STORAGE_PROVIDER="$GUEST_STORAGE_PROVIDER"
            SUPABASE_STORAGE_BUCKET=p170-dataset
            SUPABASE_STORAGE_PREFIX=datasets
            LLM_PROVIDER="$LLM_PROVIDER"
            LLM_MODEL="$LLM_MODEL"
            AGENT_TRACE_MODE=shadow
            UX_COMMAND_CENTER_ENABLED=true
          )
          google_drive_redirect_uri="${GOOGLE_DRIVE_REDIRECT_URI:-$BACKEND_URL/api/v1/google-drive/callback}"
          google_drive_frontend_url="${GOOGLE_DRIVE_FRONTEND_URL:-$FRONTEND_URL}"
          # An empty optional value is skipped so App Service keeps the setting it already holds.
          for name in \
            DATABASE_URL DATABASE_CHECKPOINTER_URL SUPABASE_SECRET_KEY \
            DATASOURCE_ENCRYPTION_KEY LLM_API_KEY \
            LANGSMITH_TRACING LANGSMITH_API_KEY LANGSMITH_PROJECT; do
            if [ -n "${!name:-}" ]; then
              settings+=("$name=${!name}")
            fi
          done
          if [ "$STORAGE_PROVIDER" = "google_drive" ]; then
            settings+=(
              GOOGLE_DRIVE_CLIENT_ID="$GOOGLE_DRIVE_CLIENT_ID"
              GOOGLE_DRIVE_CLIENT_SECRET="$GOOGLE_DRIVE_CLIENT_SECRET"
              GOOGLE_DRIVE_REDIRECT_URI="$google_drive_redirect_uri"
              GOOGLE_DRIVE_FOLDER_ID="$GOOGLE_DRIVE_FOLDER_ID"
              GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY="$GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY"
              GOOGLE_DRIVE_FRONTEND_URL="$google_drive_frontend_url"
            )
          fi

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --settings "${settings[@]}" \
            --output none

          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WORKER_APP" \
            --container-image-name "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --container-registry-user "$ACR_PULL_USERNAME" \
            --container-registry-password "$ACR_PULL_PASSWORD" \
            --enable-app-service-storage false

          worker_settings=(
            "${settings[@]}"
            PYTHONPATH=/app/backend
            PROFILING_WORKER_CONCURRENCY="$PROFILING_WORKER_CONCURRENCY"
          )
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WORKER_APP" \
            --settings "${worker_settings[@]}" \
            --output none
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WORKER_APP" \
            --startup-file "python -m src.workers.profiling_worker --health-port 8000" \
            --always-on true \
            --output none

      - name: Deploy frontend container
        shell: bash
        env:
          ACR_PULL_USERNAME: ${{ secrets.ACR_PULL_USERNAME }}
          ACR_PULL_PASSWORD: ${{ secrets.ACR_PULL_PASSWORD }}
        run: |
          set -euo pipefail
          az() {
            docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" az "$@"
          }
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --container-image-name "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --container-registry-user "$ACR_PULL_USERNAME" \
            --container-registry-password "$ACR_PULL_PASSWORD" \
            --enable-app-service-storage false
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --settings WEBSITES_PORT=8080 PORT=8080 NODE_ENV=production WEBSITES_CONTAINER_START_TIME_LIMIT=1800 INTERNAL_API_URL="$BACKEND_URL/api/v1" \
            --output none
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --startup-file "node server.js" \
            --output none

      - name: Restart apps
        shell: bash
        run: |
          set -euo pipefail
          az() {
            docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" az "$@"
          }
          for app in "$BACKEND_APP" "$WORKER_APP" "$FRONTEND_APP"; do
            az webapp restart --resource-group "$RESOURCE_GROUP" --name "$app"
          done

      - name: Verify deployed endpoints
        shell: bash
        run: |
          set -euo pipefail
          wait_for_url() {
            local name="$1"
            local url="$2"
            local attempts="$3"
            local body_file
            body_file="$(mktemp)"

            for attempt in $(seq 1 "$attempts"); do
              local status
              status="$(curl --silent --show-error --output "$body_file" --write-out "%{http_code}" --max-time 15 "$url" || true)"
              if [ "$status" = "200" ]; then
                echo "$name became healthy at $url."
                cat "$body_file"
                echo
                rm -f "$body_file"
                return 0
              fi

              echo "$name health attempt $attempt/$attempts returned ${status:-curl_failed} from $url."
              if [ -s "$body_file" ]; then
                head -c 500 "$body_file"
                echo
              fi
              sleep 10
            done

            rm -f "$body_file"
            echo "$name did not become healthy at $url."
            return 1
          }

          wait_for_url Backend "$BACKEND_URL/health" 90
          wait_for_url ProfilingWorker "https://${WORKER_APP}.azurewebsites.net/health" 90
          wait_for_url Frontend "$FRONTEND_URL/health" 60
