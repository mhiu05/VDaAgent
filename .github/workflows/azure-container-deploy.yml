name: Deploy Azure Containers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-container-release
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-p170-hieu
  ACR_NAME: p170acr08140037
  ACR_LOGIN_SERVER: p170acr08140037.azurecr.io
  BACKEND_APP: p170-api-08140037
  FRONTEND_APP: p170-web-08140019
  BACKEND_URL: https://p170-api-08140037.azurewebsites.net
  FRONTEND_URL: https://p170-web-08140019.azurewebsites.net
  AZURE_CLI_IMAGE: mcr.microsoft.com/azure-cli:2.75.0

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_PULL_USERNAME: ${{ secrets.ACR_PULL_USERNAME }}
          ACR_PULL_PASSWORD: ${{ secrets.ACR_PULL_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            ACR_PULL_USERNAME ACR_PULL_PASSWORD \
            DATABASE_URL SUPABASE_SECRET_KEY \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            test -n "${!name}" || { echo "Missing production secret: $name"; exit 1; }
          done

      - name: Azure login with OIDC
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token_response="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
          federated_token="$(printf '%s' "$token_response" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
          if [ -z "$federated_token" ]; then
            echo "Could not extract GitHub OIDC token response."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/azure"
          docker pull "$AZURE_CLI_IMAGE"
          docker run --rm \
            -v "$RUNNER_TEMP/azure:/root/.azure" \
            "$AZURE_CLI_IMAGE" \
            az login \
              --service-principal \
              --username "$AZURE_CLIENT_ID" \
              --tenant "$AZURE_TENANT_ID" \
              --federated-token "$federated_token" \
              --output none
          docker run --rm \
            -v "$RUNNER_TEMP/azure:/root/.azure" \
            "$AZURE_CLI_IMAGE" \
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "AZURE_CONFIG_DIR_HOST=$RUNNER_TEMP/azure" >> "$GITHUB_ENV"

      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          acr_token="$(docker run --rm \
            -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" \
            "$AZURE_CLI_IMAGE" \
            az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv)"
          printf '%s' "$acr_token" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile.backend.azure \
            -t "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/backend:latest" \
            .
          docker push "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/backend:latest"

      - name: Build and push frontend image
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_AUTH_ALLOW_GUEST: ${{ vars.NEXT_PUBLIC_AUTH_ALLOW_GUEST || 'true' }}
          NEXT_PUBLIC_AUTH_ALLOW_SIGNUP: ${{ vars.NEXT_PUBLIC_AUTH_ALLOW_SIGNUP || 'true' }}
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile.frontend.azure \
            --build-arg NEXT_PUBLIC_API_URL="$BACKEND_URL/api/v1" \
            --build-arg NEXT_PUBLIC_SITE_URL="$FRONTEND_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_AUTH_ALLOW_GUEST="$NEXT_PUBLIC_AUTH_ALLOW_GUEST" \
            --build-arg NEXT_PUBLIC_AUTH_ALLOW_SIGNUP="$NEXT_PUBLIC_AUTH_ALLOW_SIGNUP" \
            --build-arg NEXT_PUBLIC_UX_COMMAND_CENTER_ENABLED=true \
            -t "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/frontend:latest" \
            frontend
          docker push "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/frontend:latest"

      - name: Run Alembic migrations
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${DATABASE_MIGRATION_URL:-}" ]; then
            echo "Skipping migrations because DATABASE_URL and DATABASE_MIGRATION_URL are not configured."
            exit 0
          fi
          docker run --rm \
            -e DATABASE_URL \
            -e DATABASE_MIGRATION_URL \
            "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
            alembic -c alembic.ini upgrade head

      - name: Deploy backend container
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CHECKPOINTER_URL: ${{ secrets.DATABASE_CHECKPOINTER_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          AUTH_ALLOW_GUEST: ${{ vars.NEXT_PUBLIC_AUTH_ALLOW_GUEST || 'true' }}
          AUTH_ALLOW_SIGNUP: ${{ vars.NEXT_PUBLIC_AUTH_ALLOW_SIGNUP || 'true' }}
          ACR_PULL_USERNAME: ${{ secrets.ACR_PULL_USERNAME }}
          ACR_PULL_PASSWORD: ${{ secrets.ACR_PULL_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --container-image-name "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --container-registry-user "$ACR_PULL_USERNAME" \
            --container-registry-password "$ACR_PULL_PASSWORD" \
            --enable-app-service-storage false

          settings=(
            APP_ENV=production
            APP_LOG_LEVEL=INFO
            APP_HOST=0.0.0.0
            APP_PORT=8000
            WEBSITES_PORT=8000
            WEBSITES_CONTAINER_START_TIME_LIMIT=1800
            CORS_ORIGINS="$FRONTEND_URL"
            AUTH_MODE=supabase
            AUTH_ALLOW_GUEST="$AUTH_ALLOW_GUEST"
            AUTH_ALLOW_SIGNUP="$AUTH_ALLOW_SIGNUP"
            AUTH_REQUIRE_EMAIL_CONFIRMED=true
            SUPABASE_AUTH_AUDIENCE=authenticated
            SUPABASE_URL="$SUPABASE_URL"
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
            STORAGE_PROVIDER=supabase
            GUEST_STORAGE_PROVIDER=supabase
            SUPABASE_STORAGE_BUCKET=p170-dataset
            SUPABASE_STORAGE_PREFIX=datasets
            LLM_PROVIDER=openai
            LLM_MODEL=gpt-4o-mini
            AGENT_TRACE_MODE=shadow
            UX_COMMAND_CENTER_ENABLED=true
          )
          [ -n "${DATABASE_URL:-}" ] && settings+=(DATABASE_URL="$DATABASE_URL")
          [ -n "${DATABASE_CHECKPOINTER_URL:-}" ] && settings+=(DATABASE_CHECKPOINTER_URL="$DATABASE_CHECKPOINTER_URL")
          [ -n "${SUPABASE_SECRET_KEY:-}" ] && settings+=(SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY")
          [ -n "${LLM_API_KEY:-}" ] && settings+=(LLM_API_KEY="$LLM_API_KEY")

          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --settings "${settings[@]}" \
            --output none

      - name: Deploy frontend container
        shell: bash
        env:
          ACR_PULL_USERNAME: ${{ secrets.ACR_PULL_USERNAME }}
          ACR_PULL_PASSWORD: ${{ secrets.ACR_PULL_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --container-image-name "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}" \
            --container-registry-url "https://$ACR_LOGIN_SERVER" \
            --container-registry-user "$ACR_PULL_USERNAME" \
            --container-registry-password "$ACR_PULL_PASSWORD" \
            --enable-app-service-storage false
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --settings WEBSITES_PORT=8080 PORT=8080 NODE_ENV=production WEBSITES_CONTAINER_START_TIME_LIMIT=1800 INTERNAL_API_URL="$BACKEND_URL/api/v1" \
            --output none

      - name: Restart apps
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$BACKEND_APP"
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP"

      - name: Verify deployed endpoints
        shell: bash
        run: |
          set -euo pipefail
          backend_ok=false
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 10 "$BACKEND_URL/health"; then
              backend_ok=true
              break
            fi
            sleep 10
          done
          if [ "$backend_ok" != "true" ]; then
            echo "Backend did not become healthy at $BACKEND_URL/health."
            exit 1
          fi

          frontend_ok=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 "$FRONTEND_URL/health" > /dev/null; then
              frontend_ok=true
              break
            fi
            sleep 10
          done
          if [ "$frontend_ok" != "true" ]; then
            echo "Frontend did not become healthy at $FRONTEND_URL/health."
            exit 1
          fi
