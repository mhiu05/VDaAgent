name: Deploy Azure containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-container-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall -q backend/src
          # The repository has a separate formatting backlog. F catches
          # undefined names/imports and other runtime-facing lint failures.
          python -m ruff check --select F backend tests

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify frontend unit checks
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Verify frontend browser flows
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

  deploy:
    name: Build, migrate, and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate production configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          AZURE_BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
          AZURE_FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
          AZURE_BACKEND_URL: ${{ vars.AZURE_BACKEND_URL }}
          AZURE_FRONTEND_URL: ${{ vars.AZURE_FRONTEND_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          AUTH_ALLOW_SIGNUP: ${{ vars.AUTH_ALLOW_SIGNUP }}
          AUTH_ALLOW_GUEST: ${{ vars.AUTH_ALLOW_GUEST }}
        run: |
          set -euo pipefail
          for name in \
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID \
            DATABASE_URL SUPABASE_SECRET_KEY \
            AZURE_RESOURCE_GROUP AZURE_ACR_NAME AZURE_ACR_LOGIN_SERVER \
            AZURE_BACKEND_APP AZURE_FRONTEND_APP AZURE_BACKEND_URL AZURE_FRONTEND_URL \
            SUPABASE_URL SUPABASE_PUBLISHABLE_KEY AUTH_ALLOW_SIGNUP AUTH_ALLOW_GUEST; do
            test -n "${!name}" || { echo "Missing production secret or variable: $name"; exit 1; }
          done

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR access token
        id: acr
        uses: azure/cli@v2
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        with:
          inlineScript: |
            token="$(az acr login --name "$AZURE_ACR_NAME" --expose-token --query accessToken --output tsv)"
            echo "::add-mask::$token"
            echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr.outputs.token }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend.azure
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: Dockerfile.frontend.azure
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.AZURE_BACKEND_URL }}/api/v1
            NEXT_PUBLIC_SITE_URL=${{ vars.AZURE_FRONTEND_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_AUTH_ALLOW_SIGNUP=${{ vars.AUTH_ALLOW_SIGNUP }}
            NEXT_PUBLIC_AUTH_ALLOW_GUEST=${{ vars.AUTH_ALLOW_GUEST }}
            NEXT_PUBLIC_UX_COMMAND_CENTER_ENABLED=true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run Alembic migration once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          BACKEND_IMAGE: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/backend:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL \
            -e DATABASE_MIGRATION_URL \
            "$BACKEND_IMAGE" \
            alembic -c alembic.ini upgrade head
          docker run --rm \
            -e DATABASE_URL \
            -e DATABASE_MIGRATION_URL \
            "$BACKEND_IMAGE" \
            alembic -c alembic.ini current

      - name: Configure and deploy backend
        id: backend
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
          AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CHECKPOINTER_URL: ${{ secrets.DATABASE_CHECKPOINTER_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CORS_ORIGINS: ${{ vars.AZURE_FRONTEND_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          AUTH_ALLOW_SIGNUP: ${{ vars.AUTH_ALLOW_SIGNUP }}
          AUTH_ALLOW_GUEST: ${{ vars.AUTH_ALLOW_GUEST }}
        with:
          inlineScript: |
            set -euo pipefail
            previous="$(az webapp config show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_BACKEND_APP" --query linuxFxVersion --output tsv)"
            echo "image=${previous#DOCKER|}" >> "$GITHUB_OUTPUT"
            az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_BACKEND_APP" --output none --settings \
              APP_ENV=production APP_LOG_LEVEL=INFO APP_HOST=0.0.0.0 APP_PORT=8000 WEBSITES_PORT=8000 \
              CORS_ORIGINS="$CORS_ORIGINS" DATABASE_URL="$DATABASE_URL" DATABASE_CHECKPOINTER_URL="$DATABASE_CHECKPOINTER_URL" \
              AUTH_MODE=supabase AUTH_ALLOW_SIGNUP="$AUTH_ALLOW_SIGNUP" AUTH_ALLOW_GUEST="$AUTH_ALLOW_GUEST" AUTH_REQUIRE_EMAIL_CONFIRMED=true \
              SUPABASE_AUTH_AUDIENCE=authenticated SUPABASE_URL="$SUPABASE_URL" SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SUPABASE_SECRET_KEY" \
              STORAGE_PROVIDER=supabase GUEST_STORAGE_PROVIDER=supabase SUPABASE_STORAGE_BUCKET=p170-dataset SUPABASE_STORAGE_PREFIX=datasets \
              LLM_PROVIDER=openai LLM_MODEL=gpt-4o-mini LLM_API_KEY="$LLM_API_KEY" AGENT_TRACE_MODE=shadow \
              UX_COMMAND_CENTER_ENABLED=true
            az webapp update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_BACKEND_APP" --https-only true --output none
            plan_id="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_BACKEND_APP" --query appServicePlanId --output tsv)"
            tier="$(az appservice plan show --ids "$plan_id" --query sku.tier --output tsv)"
            if [ "$tier" != "Free" ] && [ "$tier" != "Shared" ]; then
              az webapp config set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_BACKEND_APP" --always-on true --health-check-path /health --output none
            fi
            az webapp config container set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_BACKEND_APP" \
              --container-image-name "$AZURE_ACR_LOGIN_SERVER/backend:${{ github.sha }}" \
              --container-registry-url "https://$AZURE_ACR_LOGIN_SERVER" --output none

      - name: Wait for backend health
        id: backend_health
        continue-on-error: true
        env:
          AZURE_BACKEND_URL: ${{ vars.AZURE_BACKEND_URL }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 "$AZURE_BACKEND_URL/health"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Roll back backend when health check fails
        if: steps.backend_health.outcome == 'failure'
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_BACKEND_APP: ${{ vars.AZURE_BACKEND_APP }}
          PREVIOUS_IMAGE: ${{ steps.backend.outputs.image }}
        with:
          inlineScript: |
            test -n "$PREVIOUS_IMAGE" || { echo "No previous backend image to roll back to."; exit 1; }
            az webapp config container set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_BACKEND_APP" --container-image-name "$PREVIOUS_IMAGE" --output none

      - name: Stop release after backend failure
        if: steps.backend_health.outcome == 'failure'
        run: exit 1

      - name: Configure and deploy frontend
        id: frontend
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
          AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          AZURE_BACKEND_URL: ${{ vars.AZURE_BACKEND_URL }}
        with:
          inlineScript: |
            set -euo pipefail
            previous="$(az webapp config show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_APP" --query linuxFxVersion --output tsv)"
            echo "image=${previous#DOCKER|}" >> "$GITHUB_OUTPUT"
            az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_APP" --output none --settings \
              WEBSITES_PORT=8080 PORT=8080 NODE_ENV=production INTERNAL_API_URL="$AZURE_BACKEND_URL/api/v1"
            az webapp update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_APP" --https-only true --output none
            plan_id="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_APP" --query appServicePlanId --output tsv)"
            tier="$(az appservice plan show --ids "$plan_id" --query sku.tier --output tsv)"
            if [ "$tier" != "Free" ] && [ "$tier" != "Shared" ]; then
              az webapp config set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_APP" --always-on true --health-check-path /login --output none
            fi
            az webapp config container set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_APP" \
              --container-image-name "$AZURE_ACR_LOGIN_SERVER/frontend:${{ github.sha }}" \
              --container-registry-url "https://$AZURE_ACR_LOGIN_SERVER" --output none

      - name: Wait for frontend health
        id: frontend_health
        continue-on-error: true
        env:
          AZURE_FRONTEND_URL: ${{ vars.AZURE_FRONTEND_URL }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 "$AZURE_FRONTEND_URL/login" > /dev/null; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Roll back frontend when health check fails
        if: steps.frontend_health.outcome == 'failure'
        uses: azure/cli@v2
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_FRONTEND_APP: ${{ vars.AZURE_FRONTEND_APP }}
          PREVIOUS_IMAGE: ${{ steps.frontend.outputs.image }}
        with:
          inlineScript: |
            test -n "$PREVIOUS_IMAGE" || { echo "No previous frontend image to roll back to."; exit 1; }
            az webapp config container set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FRONTEND_APP" --container-image-name "$PREVIOUS_IMAGE" --output none

      - name: Stop release after frontend failure
        if: steps.frontend_health.outcome == 'failure'
        run: exit 1
