name: Deploy Azure Containers

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-p170-hieu
  ACR_NAME: p170acr08140037
  ACR_LOGIN_SERVER: p170acr08140037.azurecr.io
  BACKEND_APP: p170-api-08140037
  FRONTEND_APP: p170-web-08140019
  BACKEND_URL: https://p170-api-08140037.azurewebsites.net
  FRONTEND_URL: https://p170-web-08140019.azurewebsites.net
  AZURE_CLI_IMAGE: mcr.microsoft.com/azure-cli:2.75.0

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token_response="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")"
          federated_token="$(printf '%s' "$token_response" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')"
          if [ -z "$federated_token" ]; then
            echo "Could not extract GitHub OIDC token response."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/azure"
          docker pull "$AZURE_CLI_IMAGE"
          docker run --rm \
            -v "$RUNNER_TEMP/azure:/root/.azure" \
            "$AZURE_CLI_IMAGE" \
            az login \
              --service-principal \
              --username "$AZURE_CLIENT_ID" \
              --tenant "$AZURE_TENANT_ID" \
              --federated-token "$federated_token" \
              --output none
          docker run --rm \
            -v "$RUNNER_TEMP/azure:/root/.azure" \
            "$AZURE_CLI_IMAGE" \
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "AZURE_CONFIG_DIR_HOST=$RUNNER_TEMP/azure" >> "$GITHUB_ENV"

      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          acr_token="$(docker run --rm \
            -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" \
            "$AZURE_CLI_IMAGE" \
            az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv)"
          printf '%s' "$acr_token" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build and push backend image
        run: |
          docker build \
            -f Dockerfile.backend.azure \
            -t "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/backend:latest" \
            .
          docker push "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/backend:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            -f Dockerfile.frontend.azure \
            --build-arg NEXT_PUBLIC_API_URL="$BACKEND_URL/api/v1" \
            --build-arg NEXT_PUBLIC_SITE_URL="$FRONTEND_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_AUTH_ALLOW_GUEST="${{ vars.NEXT_PUBLIC_AUTH_ALLOW_GUEST || 'true' }}" \
            --build-arg NEXT_PUBLIC_AUTH_ALLOW_SIGNUP="${{ vars.NEXT_PUBLIC_AUTH_ALLOW_SIGNUP || 'true' }}" \
            -t "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}" \
            -t "$ACR_LOGIN_SERVER/frontend:latest" \
            frontend
          docker push "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}"
          docker push "$ACR_LOGIN_SERVER/frontend:latest"

      - name: Deploy backend container
        run: |
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --container-image-name "$ACR_LOGIN_SERVER/backend:${GITHUB_SHA}" \
            --container-registry-url "https://$ACR_LOGIN_SERVER"
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --settings WEBSITES_PORT=8000 \
            --output none

      - name: Deploy frontend container
        run: |
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --container-image-name "$ACR_LOGIN_SERVER/frontend:${GITHUB_SHA}" \
            --container-registry-url "https://$ACR_LOGIN_SERVER"
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --settings WEBSITES_PORT=8080 PORT=8080 NODE_ENV=production \
              NEXT_PUBLIC_API_URL="$BACKEND_URL/api/v1" \
              NEXT_PUBLIC_SITE_URL="$FRONTEND_URL" \
            --output none

      - name: Restart apps
        run: |
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$BACKEND_APP"
          docker run --rm -v "$AZURE_CONFIG_DIR_HOST:/root/.azure" "$AZURE_CLI_IMAGE" \
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP"
