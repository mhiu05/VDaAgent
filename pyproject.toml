[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p170-profiling-agent"
version = "1.0.0"
description = "AI Data Profiling Agent — tự lập hồ sơ dữ liệu, HITL xác nhận metadata, Q&A có căn cứ số liệu"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    # Web / API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    # Agent
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # Compute engine — mọi con số do đây tính, LLM không tự tính
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    # Metadata DB
    "sqlalchemy>=2.0.0",
    # Retrieval — nhánh QA định tính
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
# Production: PostgreSQL cho metadata + LangGraph checkpointer (ADR-009)
db = [
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]
# Embedding local cho nhánh QA định tính (bỏ trống thì dùng BM25 sparse)
embed = [
    "sentence-transformers>=3.0.0",
]
# Cross-encoder rerank — bật retrieval.enable_rerank sau khi cài
rerank = [
    "sentence-transformers>=3.0.0",
]
all = [
    "p170-profiling-agent[dev,db,embed]",
]

[project.scripts]
p170 = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.webui" = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = [".venv", ".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "C90", "N", "D", "SIM", "T20", "TID", "TRY", "RUF"]
ignore = ["D100", "D104", "S101", "T201"]
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
